name: Build rbfx for VAIO (SSE3)
on: [workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      # 1. Clone the ACTUAL rbfx engine into a folder named 'engine'
      - name: Clone rbfx Source
        run: |
          git clone --recursive https://github.com/rbfx/rbfx.git engine

      # 2. Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libasound2-dev libpulse-dev libdbus-1-dev ninja-build

      # 3. Build inside the 'engine' folder
      - name: Configure and Build
        run: |
          cd engine
          mkdir build && cd build
          # -msse3 ensures it runs on your E-350
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRBFX_EDITOR=ON \
            -DURHO3D_SSE=3 \
            -DCMAKE_CXX_FLAGS="-msse3" \
            -DCMAKE_C_FLAGS="-msse3"
          ninja

      # 4. Upload the binaries
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbfx-editor-linux-sse3
          path: engine/build/bin/
          
