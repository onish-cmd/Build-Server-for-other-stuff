name: Build Flax Engine (Legacy Architecture)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Flax Engine (No LFS)
        uses: actions/checkout@v4
        with:
          repository: FlaxEngine/FlaxEngine
          submodules: recursive
          lfs: false 

      - name: Setup Vulkan SDK
        uses: lukka/get-vulkan-sdk@v1
        with:
          vulkan_query_version: 1.3.239.0
          vulkan_components: Vulkan-Headers, Vulkan-Loader

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git-lfs libx11-dev libxcursor-dev \
          libxinerama-dev zlib1g-dev libvulkan-dev libasound2-dev libpulse-dev

      - name: Manually Pull Current LFS
        run: |
          git lfs install
          git lfs pull || echo "Proceeding with missing objects..."

      - name: Configure for AMD E-350 (btver1)
        run: |
          echo "CFLAGS=-march=btver1 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2" >> $GITHUB_ENV
          echo "CXXFLAGS=-march=btver1 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV

      - name: Generate Project Files (Linux Only)
        run: |
          chmod +x GenerateProjectFiles.sh
          # We force it to focus on Linux to ignore missing Android/Web SDKs
          ./GenerateProjectFiles.sh -linux

      - name: Build Flax Editor
        run: |
          # Ensure the build tool was actually created and is executable
          chmod +x Source/Tools/Flax.Build/Binaries/PlatformSpecific/Linux/Flax.Build
          ./Source/Tools/Flax.Build/Binaries/PlatformSpecific/Linux/Flax.Build \
          -build -platform=Linux -arch=x64 -configuration=Development

      - name: Package Binaries
        run: |
          mkdir -p flax-legacy-build
          cp -r Binaries/ flax-legacy-build/
          cp -r Content/ flax-legacy-build/
          tar -czvf flax-linux-e350.tar.gz flax-legacy-build/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flax-engine-e350
          path: flax-linux-e350.tar.gz
