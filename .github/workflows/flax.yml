name: Continuous Deployment for Flax (E-350 Legacy)

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true # Stay suckless, opt out of tracking
  DOTNET_ROLL_FORWARD: 'minor'
  # Legacy Hardware Flags for AMD E-350
  CFLAGS: "-march=btver1 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2"
  CXXFLAGS: "-march=btver1 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2"

jobs:
  package-linux-editor:
    name: Editor (Linux Legacy)
    runs-on: "ubuntu-24.04"
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        repository: FlaxEngine/FlaxEngine
        lfs: false # Still better to pull manually to avoid those 404s

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libx11-dev libxcursor-dev libxinerama-dev \
        build-essential gettext libtool libtool-bin libpulse-dev libasound2-dev \
        libjack-dev portaudio19-dev libwayland-dev libvulkan-dev

    - name: Manual LFS Pull
      run: |
        git lfs install
        git lfs pull || echo "Proceeding with missing assets..."

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Legacy Editor
      run: |
        chmod +x PackageEditor.sh
        # We tell the script to use .NET 8 and build for Linux
        # The environment variables CFLAGS/CXXFLAGS will be picked up by the compiler
        ./PackageEditor.sh -arch=x64 -platform=Linux -deployOutput=Output -dotnet=8

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Editor-E350
        path: Output/FlaxEditorLinux.zip
        
