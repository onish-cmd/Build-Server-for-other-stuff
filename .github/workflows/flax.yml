name: Build Flax Engine (Legacy Architecture)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Flax Engine (No LFS)
        uses: actions/checkout@v4
        with:
          repository: FlaxEngine/FlaxEngine
          submodules: recursive
          lfs: false 

      - name: Install Vulkan SDK (Manual Way)
        run: |
          # Add LunarG signing key and repo for 2026 compatibility
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          # Install the full SDK plus standard Linux dev headers
          sudo apt-get install -y vulkan-sdk libx11-dev libxcursor-dev libxinerama-dev zlib1g-dev libasound2-dev libpulse-dev

      - name: Manually Pull Current LFS
        run: |
          git lfs install
          git lfs pull || echo "Proceeding with missing objects..."

      - name: Configure for AMD E-350 (btver1)
        run: |
          echo "CFLAGS=-march=btver1 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2" >> $GITHUB_ENV
          echo "CXXFLAGS=-march=btver1 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV
          # Point Flax to the Vulkan SDK location manually just in case
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV

      - name: Generate Project Files (Linux Only)
        run: |
          chmod +x GenerateProjectFiles.sh
          # Build only for Linux to avoid Android/Web SDK errors
          ./GenerateProjectFiles.sh -linux

      - name: Build Flax Editor
        run: |
          # The build tool is generated in this specific path
          chmod +x Source/Tools/Flax.Build/Binaries/PlatformSpecific/Linux/Flax.Build
          ./Source/Tools/Flax.Build/Binaries/PlatformSpecific/Linux/Flax.Build \
          -build -platform=Linux -arch=x64 -configuration=Development

      - name: Package Binaries
        run: |
          mkdir -p flax-legacy-build
          cp -r Binaries/ flax-legacy-build/
          cp -r Content/ flax-legacy-build/
          tar -czvf flax-linux-e350.tar.gz flax-legacy-build/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flax-engine-e350
          path: flax-linux-e350.tar.gz
