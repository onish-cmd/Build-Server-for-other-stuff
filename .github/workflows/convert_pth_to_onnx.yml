name: Model Conversion Pipeline
on: [workflow_dispatch]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install dependencies
        run: pip install torch torchvision onnx
      - name: Run Conversion
        shell: python
        run: |
          import torch
          import torch.nn as nn
          import os

          # 1. Architecture definition (MobileFaceNet blueprint)
          # Simplified for standard MobileFaceNet usage
          class MobileFaceNet(nn.Module):
              def __init__(self, embedding_size=128):
                  super(MobileFaceNet, self).__init__()
                  # Add your MobileFaceNet architecture structure here
                  # For brevity, this is a placeholder. Ensure your architecture 
                  # matches the weights in mobilefacenet_model_best.pth.tar
                  pass 

          # 2. Download and Load
          import urllib.request
          url = "https://huggingface.co/py-feat/mobilefacenet/resolve/main/mobilefacenet_model_best.pth.tar"
          urllib.request.urlretrieve(url, "model.tar")
          
          checkpoint = torch.load("model.tar", map_location='cpu')
          model = MobileFaceNet()
          model.load_state_dict(checkpoint['state_dict'] if 'state_dict' in checkpoint else checkpoint)
          model.eval()

          # 3. Export
          dummy_input = torch.randn(1, 3, 112, 112) # Standard MobileFaceNet input
          torch.onnx.export(model, dummy_input, "model.onnx", 
                            opset_version=11, input_names=['input'], output_names=['output'])
          print("Conversion complete.")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-onnx
          path: model.onnx
